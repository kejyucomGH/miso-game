<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武豊たまり職人：神経衰弱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card { perspective: 1000px; cursor: pointer; aspect-ratio: 1 / 1; }
        .card-inner { transition: transform 0.4s; transform-style: preserve-3d; position: relative; width: 100%; height: 100%; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .back, .front { backface-visibility: hidden; position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 0.5rem; border: 2px solid #b45309; }
        .back { background: #d97706; color: white; font-size: 2rem; }
        .front { transform: rotateY(180deg); background: white; color: #78350f; font-weight: bold; font-size: 1.5rem; }
        .card.hidden-card { opacity: 0; transform: scale(0.8); transition: all 0.5s ease; pointer-events: none; }
        .success-anim { animation: success-pop 0.5s ease-in-out; }
        @keyframes success-pop { 0% { transform: scale(1); } 50% { transform: scale(1.1) rotate(2deg); background-color: #fef3c7; } 100% { transform: scale(1); } }
        .modal-bounce { animation: modal-settle 1.2s cubic-bezier(0.1, 0.7, 0.3, 1) forwards; }
        @keyframes modal-settle { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.1); opacity: 1; } 70% { transform: scale(0.9); } 85% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center pt-4 pb-8">
    
    <header class="text-center mb-4 w-full px-4">
        <h1 class="text-xl font-bold text-amber-900 mb-2">武豊たまり職人：神経衰弱</h1>
        <div id="game-controls" class="space-x-2">
            <button onclick="initGame('PvC')" class="bg-amber-800 text-white px-3 py-1.5 rounded-lg text-sm shadow hover:bg-amber-900 transition">人間 vs AI職人</button>
            <button onclick="initGame('PvP')" class="bg-amber-800 text-white px-3 py-1.5 rounded-lg text-sm shadow hover:bg-amber-900 transition">人間 vs 人間</button>
        </div>
    </header>

    <div id="dice-screen" class="hidden fixed inset-0 bg-amber-900/90 flex flex-col items-center justify-center z-50">
        <div id="dice" class="text-8xl mb-4 text-white min-h-[120px] flex items-center justify-center"></div>
        <div id="dice-result" class="text-lg text-white font-bold px-4 text-center min-h-[30px]"></div>
    </div>

    <div id="win-modal" class="hidden fixed inset-0 bg-black/60 flex flex-col items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl p-6 max-w-[280px] w-full text-center shadow-2xl border-4 border-amber-600 modal-bounce">
            <div id="win-icon" class="text-5xl mb-3">🏺</div>
            <h2 id="win-title" class="text-lg font-bold text-amber-900 mb-2">結果発表</h2>
            <p id="win-message" class="text-gray-700 mb-6 text-sm"></p>
            <button onclick="document.getElementById('win-modal').classList.add('hidden')" class="bg-amber-700 text-white px-6 py-2 rounded-lg font-bold hover:bg-amber-800 transition w-full">閉じる</button>
        </div>
    </div>

    <div class="flex space-x-4 my-4 font-bold text-amber-900 text-xs items-center">
        <div class="text-center"><div>プレイヤー1</div><div id="score1-icons" class="text-xl mt-1 h-6"></div></div>
        <div id="turn-indicator" class="text-amber-800 px-3 py-1 bg-white rounded-full shadow border border-amber-200">待機中</div>
        <div class="text-center"><div id="p2-name">AI職人</div><div id="score2-icons" class="text-xl mt-1 h-6"></div></div>
    </div>

    <!-- コンテナ: flex-growは削除し、justify-start(上詰め)で統一 -->
    <div class="flex flex-col items-center w-full max-w-[360px] p-2">
        <div id="board" class="grid grid-cols-4 gap-2 w-full"></div>
        <div class="mt-6 px-4 text-center text-amber-900 font-bold text-xs">
            豆麹・塩・水・石の４種類をそろえて<br>「たまり醤油」を作ろう！
        </div>
    </div>

    <script>
        const ITEMS = ['豆麹', '塩', '水', '石'];
        let deck = [], flippedCards = [], score1 = 0, score2 = 0, isP1Turn = true, gameMode = 'PvP', isLocked = false;

        function initGame(mode) {
            gameMode = mode;
            document.getElementById('p2-name').innerText = mode === 'PvP' ? 'プレイヤー2' : 'AI職人';
            
            const diceScreen = document.getElementById('dice-screen');
            const diceElem = document.getElementById('dice');
            const resultElem = document.getElementById('dice-result');
            
            diceElem.innerText = '';
            resultElem.innerText = 'サイコロを振っています...';
            diceScreen.classList.remove('hidden'); 
            
            let count = 0;
            const interval = setInterval(() => {
                const val = Math.floor(Math.random()*6)+1;
                diceElem.innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][val-1];
                if (++count > 10) {
                    clearInterval(interval);
                    const final = Math.floor(Math.random()*6)+1;
                    diceElem.innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][final-1];
                    isP1Turn = (final % 2 !== 0);
                    resultElem.innerText = `出目: ${final} (${final % 2 !== 0 ? '奇数:プレイヤー1' : '偶数:' + (mode === 'PvP' ? 'プレイヤー2' : 'AI')}) の先攻！`;
                    setTimeout(() => { diceScreen.classList.add('hidden'); startGame(); }, 1500);
                }
            }, 100);
        }

        function startGame() {
            score1 = 0; score2 = 0; updateScores();
            deck = [...ITEMS, ...ITEMS, ...ITEMS, ...ITEMS].sort(() => Math.random() - 0.5);
            const board = document.getElementById('board');
            board.innerHTML = '';
            deck.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card w-full';
                card.innerHTML = `<div class="card-inner" data-item="${item}"><div class="back">?</div><div class="front">${item}</div></div>`;
                card.onclick = () => userClick(card);
                board.appendChild(card);
            });
            updateTurn();
            if (gameMode === 'PvC' && !isP1Turn) setTimeout(executePcTurn, 1000);
        }

        async function userClick(card) {
            if (isLocked || card.classList.contains('flipped') || (gameMode === 'PvC' && !isP1Turn)) return;
            await revealCard(card);
        }

        async function revealCard(card) {
            card.classList.add('flipped');
            const item = card.querySelector('.card-inner').dataset.item;
            flippedCards.push({ card, item });
            const items = flippedCards.map(f => f.item);
            if (new Set(items).size < items.length) {
                isLocked = true;
                await new Promise(r => setTimeout(r, 800));
                flippedCards.forEach(f => f.card.classList.remove('flipped'));
                flippedCards = [];
                isLocked = false;
                isP1Turn = !isP1Turn;
                updateTurn();
                if (gameMode === 'PvC' && !isP1Turn) setTimeout(executePcTurn, 1000);
            } else if (flippedCards.length === 4) {
                isLocked = true;
                flippedCards.forEach(f => f.card.classList.add('success-anim'));
                await new Promise(r => setTimeout(r, 600));
                flippedCards.forEach(f => f.card.classList.add('hidden-card'));
                if (isP1Turn) score1++; else score2++;
                updateScores();
                flippedCards = [];
                isLocked = false;
                if (score1 + score2 === 4) showWinModal();
                else if (gameMode === 'PvC' && !isP1Turn) setTimeout(executePcTurn, 1000);
            }
        }

        async function executePcTurn() {
            if (isP1Turn || isLocked) return;
            const available = Array.from(document.querySelectorAll('.card:not(.flipped):not(.hidden-card)'));
            if (available.length === 0) return;
            await revealCard(available[Math.floor(Math.random() * available.length)]);
            if (!isLocked && flippedCards.length > 0 && flippedCards.length < 4) setTimeout(executePcTurn, 800);
        }

        function updateTurn() { document.getElementById('turn-indicator').innerText = isP1Turn ? "P1の番" : (gameMode === 'PvP' ? "P2の番" : "AIの番"); }
        function updateScores() { document.getElementById('score1-icons').innerHTML = '🏺'.repeat(score1); document.getElementById('score2-icons').innerHTML = '🏺'.repeat(score2); }

        function showWinModal() {
            const modal = document.getElementById('win-modal');
            const title = document.getElementById('win-title');
            const message = document.getElementById('win-message');
            const icon = document.getElementById('win-icon');
            if (score1 > score2) { icon.innerText = '🏆'; title.innerText = 'プレイヤー1の勝利！'; message.innerText = `極上のたまり醤油が完成！ (スコア: ${score1}対${score2})`; }
            else if (score2 > score1) {
                if (gameMode === 'PvC') { icon.innerText = '🥈'; title.innerText = 'AI職人の勝利！'; message.innerText = `悔しい…！次は絶対勝つぞ！ (スコア: ${score2}対${score1})`; }
                else { icon.innerText = '🏆'; title.innerText = 'プレイヤー2の勝利！'; message.innerText = `お見事！ (スコア: ${score2}対${score1})`; }
            } else { icon.innerText = '🤝'; title.innerText = '引き分け！'; message.innerText = `互角の職人技でした！ (スコア: ${score1}対${score2})`; }
            modal.classList.remove('hidden');
        }
    </script>
</body>
</html>
